[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepjudge-legal-search"
version = "0.1.0"
description = "Mobile-friendly DeepJudge legal search API proxy."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Bronson Stowers" }
]
keywords = ["deepjudge", "legal", "search", "api", "mobile"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
deepjudge-mobile-api = "mobile_api:main"

[tool.setuptools]
py-modules = ["mobile_api"]
